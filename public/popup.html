<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }
    .control-item:last-child {
      border-bottom: none;
    }
    .control-label {
      font-size: 14px;
      color: #333;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo-128.png" alt="Arex" class="logo">
    <div class="title">Arex 录制控制</div>
  </div>
  
  <div class="control-item">
    <div class="control-label">开启录制</div>
    <label class="switch">
      <input type="checkbox" id="recordSwitch">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="status" id="status">录制已关闭</div>
  
  <script src="popup.js"></script>
</body>
</html>
